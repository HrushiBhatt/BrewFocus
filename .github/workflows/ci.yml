name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every action is pinned to a commit, not a tag: a tag can be moved to malicious code, and
# that has happened to popular actions. Dependabot proposes updates.
jobs:
  # Scans all history, so a secret that was committed and later removed still fails.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # The release binary, checked against the hash from the release's checksums file.
      # Dependabot can't update this one: take the new hash from that file when upgrading.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$asset"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$asset" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: gitleaks git --redact --no-banner --config .gitleaks.toml .

  # Unit tests (Surefire), then integration tests against the whole app on a random port (Failsafe).
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # What ships to browsers. Build tools are covered by Dependabot, not this gate.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Browser tests of the whole app against the real Spring Boot server, sign-in included.
  e2e:
    needs: [secrets, backend, frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  # The image is scanned as it ships: the OS packages, the JRE and every jar inside the app.
  image:
    needs: [secrets, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t brew-focus .
      # Not trivy-action: its installer downloads from get.trivy.dev, which stopped resolving
      # on 2026-11-03 (aquasecurity/setup-trivy#42), so the scan died before it could run.
      # The GitHub release is the same binary, and the hash pins exactly which one we trust.
      # Dependabot can't update this one: take the hash from the release's checksums file.
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.76.1
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$asset"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/$asset" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan the image
        run: trivy image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --timeout 10m brew-focus

  # The live site at https://hrushibhatt.github.io/<repo>/. Pages only serves static files, so
  # this builds the app with its in-browser backend. It tests that build the way Pages serves
  # it, and every push to main publishes it. The path
  # comes from the repo's name, so renaming the repo can't leave the site blank again.
  pages:
    # The Docker image job isn't listed on purpose: a newly published vulnerability in a base
    # image should fail that job, not take the live site offline.
    needs: [secrets, backend, frontend, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishing pushes the gh-pages branch
    # One group per branch, so a newer push to main replaces an older one, but a Dependabot pull
    # request can never cancel a deploy from main.
    concurrency:
      group: pages-${{ github.ref }}
      cancel-in-progress: true
    env:
      PAGES_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build the site
        run: make pages-build BASE="$PAGES_BASE"
      - name: Test it as Pages serves it
        run: npm run e2e:pages
        working-directory: frontend
      - name: Keep the traces of a failed test
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-pages-traces
          path: frontend/test-results
          retention-days: 7
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: frontend/dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      # A green run should mean the real site works, not just that the files were pushed.
      - name: Check the live site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          bash .github/check-live-site.sh "https://${owner}.github.io${PAGES_BASE}" frontend/dist
